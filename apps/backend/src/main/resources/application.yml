spring:
  application:
    name: AirDND
  profiles:
    default: local
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH2_GOOGLE_CLIENT_ID}
            client-secret: ${OAUTH2_GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

server:
  forward-headers-strategy: framework

app:
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://127.0.0.1:5173}

paypal:
  client-id: ${PAYPAL_CLIENT_ID}
  client-secret: ${PAYPAL_CLIENT_SECRET}
  base-url: https://api-m.sandbox.paypal.com
  currency: USD
  exchange-rate: 1550      # KRW → USD 변환용 (Sandbox는 상수로 충분)