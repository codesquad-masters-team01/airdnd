global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Layer 1 — Spring app: Hikari pool, Tomcat threads, JVM, http.server.requests
  - job_name: spring-actuator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]

  # Layer 2 — MySQL: connections, InnoDB, locks, per-digest statement latency
  - job_name: mysql
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  # Layer 3 — Machine: host CPU/mem/disk-IO/load, and per-container usage
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
